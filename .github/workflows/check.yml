name: House Notification Check

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 CST
    - cron: '0 5 * * *'   # 13:00 CST
    - cron: '0 9 * * *'   # 17:00 CST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run scraper
        env:
          PUSH_DEER_KEY: ${{ secrets.PUSH_DEER_KEY }}
        run: python src/scraper.py

      - name: Commit seen_urls cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add .cache/seen_urls.json
          git diff --cached --quiet || git commit -m "chore: update seen_urls cache"
          git push
