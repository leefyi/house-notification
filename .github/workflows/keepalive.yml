name: Keepalive

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 00:00（北京时间周一 08:00）
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
