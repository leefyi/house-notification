name: Keepalive

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 00:00（北京时间周一 08:00）
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive commit if repo idle >50 days
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          IDLE_DAYS=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          echo "Last commit was ${IDLE_DAYS} days ago"
          if [ "$IDLE_DAYS" -gt 50 ]; then
            echo "Repo idle >50 days, creating keepalive commit"
            git commit --allow-empty -m "chore: keepalive"
            git push
          else
            echo "Repo still active, no keepalive needed"
          fi
